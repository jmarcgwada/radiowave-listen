<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RadioWave — Écouter en ligne</title>
<meta name="theme-color" content="#0B1E3D" />
<meta name="description" content="Écoutez cette station de radio en ligne, sans installation." />
<meta property="og:title" content="RadioWave — Écouter en ligne" />
<meta property="og:description" content="Touchez pour écouter cette station directement dans votre navigateur." />
<meta property="og:type" content="website" />
<style>
  :root {
    --primary: #007AFF;
    --bg0: #0B1E3D;
    --bg1: #12294f;
    --card: rgba(255,255,255,0.06);
    --line: rgba(255,255,255,0.14);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.66);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(120% 120% at 50% 0%, var(--bg1) 0%, var(--bg0) 60%, #06132a 100%);
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: 22px 18px calc(28px + env(safe-area-inset-bottom));
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-weight: 800; font-size: 20px; letter-spacing: .3px; margin: 6px 0 18px;
  }
  .brand .dot { font-size: 22px; }
  .card {
    width: 100%; max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 24px 22px;
    text-align: center;
    backdrop-filter: blur(6px);
  }
  /* ---- Poster ---- */
  .poster { margin-bottom: 16px; }
  .logoWrap {
    width: 176px; height: 176px; margin: 0 auto 16px;
    border-radius: 26px; position: relative;
  }
  .logoWrap::after {
    content: ""; position: absolute; inset: -14px; border-radius: 34px; z-index: -1;
    background: radial-gradient(closest-side, rgba(0,122,255,0.5), transparent 75%);
    filter: blur(6px);
  }
  .logo {
    width: 176px; height: 176px; border-radius: 26px; object-fit: cover;
    background: rgba(255,255,255,0.08);
    border: 3px solid rgba(255,255,255,0.30);
    display: flex; align-items: center; justify-content: center; font-size: 74px;
  }
  .eyebrow { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .4px; }
  .name { font-size: 25px; font-weight: 800; margin: 4px 0 6px; line-height: 1.18; }
  .meta { color: var(--muted); font-size: 13px; min-height: 18px; }
  .play {
    margin: 20px auto 6px; width: 88px; height: 88px; border-radius: 50%;
    border: none; cursor: pointer; background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(0,122,255,0.45); transition: transform .08s ease;
  }
  .play:active { transform: scale(0.94); }
  .play svg { width: 38px; height: 38px; display: block; }
  .status { color: var(--muted); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25); border-top-color: #fff;
    animation: spin 0.8s linear infinite; margin: 6px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fallback {
    display: none; margin-top: 16px; padding: 14px;
    background: rgba(255,69,58,0.12); border: 1px solid rgba(255,69,58,0.35);
    border-radius: 14px; font-size: 13px; color: #ffd9d6; text-align: left; line-height: 1.5;
  }
  .fallback.show { display: block; }
  /* ---- Share section ---- */
  .divider { height: 1px; background: var(--line); margin: 22px 0 18px; }
  .shareTitle { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 14px; }
  .qrBox {
    background: #fff; width: 188px; height: 188px; margin: 0 auto 14px;
    border-radius: 18px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .qrBox canvas { width: 160px; height: 160px; image-rendering: pixelated; }
  .qrBox .fallbackTxt { color: #0B1E3D; font-size: 12px; padding: 0 10px; }
  .linkRow {
    display: flex; align-items: center; gap: 8px; margin: 0 0 14px;
    background: rgba(0,0,0,0.25); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px;
  }
  .linkRow .url {
    flex: 1; text-align: left; font-size: 12.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .btns { display: flex; flex-direction: column; gap: 10px; }
  .row2 { display: flex; gap: 10px; }
  .row2 .btn { flex: 1; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    text-decoration: none; cursor: pointer; border: 1px solid var(--line);
    padding: 12px 14px; border-radius: 999px; font-size: 14px; font-weight: 700;
    color: #fff; background: rgba(255,255,255,0.06); white-space: nowrap;
  }
  .btn.small { padding: 9px 12px; font-size: 13px; }
  .btn.primary { background: var(--primary); border-color: var(--primary); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 20px; text-align: center; max-width: 380px; line-height: 1.5; }
  a { color: #7ab8ff; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: #111; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s ease; border: 1px solid var(--line);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="brand"><span class="dot">📻</span><span>RadioWave</span></div>

  <div class="card" id="card">
    <!-- Poster -->
    <div class="poster">
      <div class="logoWrap"><div class="logo" id="logo">📻</div></div>
      <div class="eyebrow" id="eyebrow">Station partagée</div>
      <div class="name" id="name">Chargement…</div>
      <div class="meta" id="meta"></div>
    </div>

    <button class="play" id="play" aria-label="Lecture" style="display:none">
      <svg id="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="status" id="status"></div>

    <div class="fallback" id="fallback"></div>

    <!-- Share -->
    <div id="share" style="display:none">
      <div class="divider"></div>
      <div class="shareTitle">Partager cette station</div>
      <div class="qrBox" id="qrBox"><span class="fallbackTxt" id="qrFallback">QR indisponible</span></div>
      <div class="linkRow">
        <span class="url" id="urlText"></span>
      </div>
      <div class="row2">
        <button class="btn small" id="dlQr"><span>⬇️</span><span>Télécharger le QR</span></button>
        <button class="btn small" id="copyLink"><span>🔗</span><span>Copier le lien</span></button>
      </div>
    </div>

    <div class="btns" id="btns" style="margin-top:16px"></div>
  </div>

  <div class="foot">
    Vous écoutez une seule station.<br/>
    Installez <b>RadioWave</b> pour accéder à des milliers de radios du monde entier.
  </div>

  <div class="toast" id="toast"></div>
  <audio id="audio" preload="none" crossorigin="anonymous"></audio>

<!-- Client-side QR generator (small, MIT). Page still works without it (QR simply hidden). -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function () {
  var SERVERS = [
    'https://de1.api.radio-browser.info',
    'https://nl1.api.radio-browser.info',
    'https://at1.api.radio-browser.info'
  ];
  var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.radiowavejm.app';

  // Closed-testing beta: RadioWave is not public on the Play Store yet, so a random visitor's
  // Google account can't install it until it's on the tester list. Paste your Google Form link
  // here (1 field = e-mail) to gate install behind "join the beta". Leave '' to keep the plain
  // Play Store link (behaviour unchanged until the form URL is provided).
  var BETA_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdxPzT5Cp-8KKWpyLH02q9GzYCoLIRrhKaA4HDmGWVKaXmgbA/viewform';
  // Optional: Play Console closed-test OPT-IN link (Play Console ▸ your closed track ▸ Testers ▸
  // "Copy link"). Given to people you've ALREADY added to the tester list — it's what actually
  // unlocks the install. Falls back to the plain Play Store page if left empty.
  var BETA_OPTIN_URL = '';

  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');
  var playing = false;
  var station = null;

  var params = new URLSearchParams(location.search);
  var uuid = params.get('s') || params.get('station') || params.get('uuid');

  var ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
  var ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  function setStatus(t) { $('status').textContent = t || ''; }
  function showLoading() { $('play').style.display = 'none'; $('status').innerHTML = '<div class="spinner"></div>'; }

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  function fetchStation(id) {
    var i = 0;
    function tryNext() {
      if (i >= SERVERS.length) return Promise.resolve(null);
      var base = SERVERS[i++];
      return fetch(base + '/json/stations/byuuid/' + encodeURIComponent(id))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (arr) { return (arr && arr[0]) ? arr[0] : tryNext(); })
        .catch(function () { return tryNext(); });
    }
    return tryNext();
  }

  function countClick(id) { try { fetch(SERVERS[0] + '/json/url/' + encodeURIComponent(id)); } catch (e) {} }

  function link(label, href, primary) {
    var a = document.createElement('a');
    a.className = 'btn' + (primary ? ' primary' : '');
    a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = label;
    return a;
  }

  // Install call-to-action. During closed testing (BETA_FORM_URL set) the primary action is
  // "join the beta" (collect the tester's Google e-mail via the form); a secondary link stays
  // for people already on the tester list. Without a form URL, behaves as a plain install link.
  function installButtons(container, primary) {
    if (BETA_FORM_URL) {
      var note = document.createElement('div');
      note.style.cssText = 'font-size:12px;color:var(--muted);margin:2px 0 4px;line-height:1.5;text-align:center';
      note.textContent = "🧪 App en test fermé — laisse ton e-mail Google pour recevoir l'accès, puis installe-la.";
      container.appendChild(note);
      container.appendChild(link('🧪 Rejoindre la bêta', BETA_FORM_URL, primary));
      var store = link('Déjà testeur ? Ouvrir le Play Store', BETA_OPTIN_URL || PLAY_STORE, false);
      store.className += ' small';
      container.appendChild(store);
    } else {
      container.appendChild(link("📲 Installer l'app RadioWave", PLAY_STORE, primary));
    }
  }

  // ---- QR (encodes the current page URL) ----
  var qrCanvas = null;
  function buildQr() {
    if (typeof qrcode !== 'function') return; // lib failed to load → keep fallback text
    try {
      var qr = qrcode(0, 'M');
      qr.addData(location.href);
      qr.make();
      var count = qr.getModuleCount();
      var cell = 8, margin = 2;
      var size = (count + margin * 2) * cell;
      var cv = document.createElement('canvas');
      cv.width = size; cv.height = size;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#0B1E3D';
      for (var r = 0; r < count; r++) {
        for (var c = 0; c < count; c++) {
          if (qr.isDark(r, c)) ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell, cell);
        }
      }
      var box = $('qrBox');
      box.innerHTML = '';
      box.appendChild(cv);
      qrCanvas = cv;
    } catch (e) { /* keep fallback */ }
  }

  function downloadQr() {
    if (!qrCanvas) { toast('QR indisponible'); return; }
    try {
      var a = document.createElement('a');
      a.href = qrCanvas.toDataURL('image/png');
      a.download = 'radiowave-' + ((station && station.name) ? station.name.replace(/[^a-z0-9]+/gi, '-').toLowerCase() : 'station') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast('Téléchargement impossible'); }
  }

  function copyLink() {
    var url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { toast('Lien copié'); }, function () { toast('Copie impossible'); });
    } else {
      try {
        var t = document.createElement('textarea'); t.value = url; document.body.appendChild(t);
        t.select(); document.execCommand('copy'); t.remove(); toast('Lien copié');
      } catch (e) { toast('Copie impossible'); }
    }
  }

  function setupShare() {
    $('urlText').textContent = location.href.replace(/^https?:\/\//, '');
    $('share').style.display = 'block';
    buildQr();
    $('dlQr').addEventListener('click', downloadQr);
    $('copyLink').addEventListener('click', copyLink);
  }

  function renderNoStation(title, sub) {
    $('logo').textContent = '📻';
    $('eyebrow').textContent = 'RadioWave';
    $('name').textContent = title || 'Radio en ligne';
    $('meta').textContent = sub || 'Aucune station indiquée dans le lien.';
    installButtons($('btns'), true);
  }

  function renderStation(st) {
    station = st;
    var stream = st.url_resolved || st.url || '';
    var mixed = location.protocol === 'https:' && /^http:\/\//i.test(stream);

    var logo = $('logo');
    if (st.favicon && !(location.protocol === 'https:' && /^http:\/\//i.test(st.favicon))) {
      var img = new Image();
      img.className = 'logo'; img.alt = st.name || '';
      img.onload = function () { logo.replaceWith(img); img.id = 'logo'; };
      img.onerror = function () {};
      img.src = st.favicon;
    }

    $('eyebrow').textContent = 'En écoute';
    $('name').textContent = st.name || 'Station';
    var bits = [];
    if (st.country) bits.push(st.country);
    if (st.tags) bits.push(String(st.tags).split(',')[0]);
    if (st.bitrate) bits.push(st.bitrate + ' kbps');
    $('meta').textContent = bits.join('  ·  ');

    var btns = $('btns');
    btns.innerHTML = '';
    installButtons(btns, false);

    setupShare();

    if (!stream) { showFallback("Le flux de cette station est indisponible."); return; }

    audio.src = stream;
    var play = $('play');
    play.style.display = 'flex';
    setStatus('Touchez pour écouter');

    play.addEventListener('click', function () {
      if (playing) { audio.pause(); }
      else {
        setStatus('Connexion au flux…');
        var p = audio.play();
        if (p && p.catch) p.catch(function () { onPlayFail(stream, mixed); });
        countClick(st.stationuuid || uuid);
      }
    });
    audio.addEventListener('playing', function () { playing = true; $('icon').innerHTML = ICON_PAUSE; setStatus('▶ Lecture en cours'); });
    audio.addEventListener('pause',   function () { playing = false; $('icon').innerHTML = ICON_PLAY; setStatus('⏸ En pause'); });
    audio.addEventListener('waiting', function () { setStatus('Connexion au flux…'); });
    audio.addEventListener('error',   function () { onPlayFail(stream, mixed); });
  }

  function onPlayFail(stream, mixed) {
    playing = false; $('icon').innerHTML = ICON_PLAY; setStatus('');
    var msg = mixed
      ? "Cette station diffuse en HTTP non sécurisé : votre navigateur peut bloquer la lecture. Ouvrez le flux directement, ou écoutez-la dans l'application (aucune limite)."
      : "Impossible de lire cette station dans le navigateur. Essayez d'ouvrir le flux directement, ou écoutez-la dans l'application.";
    showFallback(msg);
    var btns = $('btns');
    if (!document.getElementById('openStream') && stream) {
      var a = link('▶ Ouvrir le flux directement', stream, false); a.id = 'openStream';
      btns.insertBefore(a, btns.firstChild);
    }
    if (station && station.homepage && !document.getElementById('openHome')) {
      var h = link('🌐 Site de la station', station.homepage, false); h.id = 'openHome';
      btns.appendChild(h);
    }
  }

  function showFallback(text) { var f = $('fallback'); f.textContent = text; f.classList.add('show'); }

  // ---- boot ----
  if (!uuid) { renderNoStation(); return; }
  showLoading();
  fetchStation(uuid).then(function (st) {
    $('status').innerHTML = '';
    if (st) renderStation(st);
    else renderNoStation('Station introuvable', 'Ce lien de station n’est plus valide.');
  });
})();
</script>
</body>
</html>
